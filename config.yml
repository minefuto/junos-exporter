general:
  prefix: junos
  timeout: 60

credentials:
  default:
    username: admin
    password: admin@123
#    private_key: ~/.ssh/id_rsa
#    private_key_passphrase: admin@123

modules:
  default:
    tables:
      - SystemAlarmStatus
      - ChassisAlarmStatus
      - FpcStatus
      - HardwareStatus
      - EnvironmentStatus
      - RoutingEngineStatus
      - StorageStatus
      - PhysicalInterfaceStatus
      - LogicalInterfaceStatus
      - InterfaceOpticStatus
      - LldpStatus
      - LacpStatus
      - RouteStatus
      - ArpStatus
      - OspfInterfaceStatus
      - OspfNeighborStatus
      - BgpStatus
      - BgpRouteStatus
      - VrrpStatus
      - BfdStatus

tables:
  SystemAlarmStatus:
    rpc: get-system-alarm-information
    item: alarm-detail
    metrics:
      - name: system_alarm_time
        path: alarm-time
        type: counter
        help: Alarm time of show system alarm
        to_unixtime: True
    labels:
      - name: class
        path: alarm-class
      - name: description
        path: alarm-description
      - name: type
        path: alarm-type

  ChassisAlarmStatus:
    rpc: get-alarm-information
    item: alarm-detail
    metrics:
      - name: chassis_alarm_time
        path: alarm-time
        type: counter
        help: Alarm time of show chassis alarm
        to_unixtime: True
    labels:
      - name: class
        path: alarm-class
      - name: description
        path: alarm-description
      - name: type
        path: alarm-type

  FpcStatus:
    rpc: get-fpc-information
    item: fpc
    recursive: True
    metrics:
      - name: fpc_state
        path: state
        type: gauge
        help: "State of show chassis fpc(Online: 3, Offline: 2, Present: 1, Empty: 0)"
        value_transform:
          "Online": 3
          "Offline": 2
          "Present": 1
          "Empty": 0
      - name: fpc_cpu_usage
        path: cpu-total
        type: gauge
        help: CPU Utilization Total of show chassis fpc
      - name: fpc_memory_heap_utilization
        path: memory-heap-utilization
        help: Memory Utilization Heap of show chassis fpc
        type: gauge
      - name: fpc_memory_buffer_utilization
        path: memory-buffer-utilization
        help: Memory Utilization Buffer of show chassis fpc
        type: gauge
    labels:
      - name: slot
        path: slot

  HardwareStatus:
    rpc: get-chassis-inventory
    item:
      - chassis
      - chassis-module
      - chassis-sub-module
      - chassis-sub-sub-module
      - chassis-sub-sub-sub-module
    recursive: True
    metrics:
      - name: hardware_info
        value: 1
        type: gauge
        help: Infomation of show chassis hardware
    labels:
      - name: name
        path: name
      - name: serial
        path: serial-number
      - name: part_number
        path: part-number
      - name: description
        path: description

  EnvironmentStatus:
    rpc: get-environment-information
    item: environment-item
    metrics:
      - name: environment_status
        path: status
        type: gauge
        help: "Status of show chassis environment(OK: 4, Testing: 3, Check: 2, Failed: 1, Absent: 0)"
        value_transform:
          "OK": 4
          "Testing": 3
          "Check": 2
          "Failed": 1
          "Absent": 0
    labels:
      - name: name
        path: name

  RoutingEngineStatus:
    rpc: get-route-engine-information
    item: route-engine
    metrics:
      - name: routing_engine_mastership_state
        path: mastership-state
        type: gauge
        help: "Current state of show chassis routing-engine(Master: 2, Backup: 1, Disabled: 0)"
        value_transform:
          "master": 2
          "backup": 1
          "disabled": 0
      - name: routing_engine_memory_buffer_utilization
        path: memory-buffer-utilization
        type: gauge
        help: Memory utilization of show chassis routing-engine
      - name: routing_engine_cpu_user_utilization
        path: cpu-user
        type: gauge
        help: CPU utilization User of show chassis routing-engine
      - name: routing_engine_cpu_background_utilization
        path: cpu-background
        type: gauge
        help: CPU utilization Background of show chassis routing-engine
      - name: routing_engine_cpu_system_utilization
        path: cpu-system
        type: gauge
        help: CPU utilization Kernel of show chassis routing-engine
      - name: routing_engine_cpu_interrupt_utilization
        path: cpu-interrupt
        type: gauge
        help: CPU utilization Interrupt of show chassis routing-engine
      - name: routing_engine_cpu_idle_utilization
        path: cpu-idle
        type: gauge
        help: CPU utilization Idle of show chassis routing-engine
      - name: routing_engine_start_time
        path: start-time
        type: counter
        help: Start time of show chassis routing-engine
        to_unixtime: True
    labels:
      - name: slot
        path: slot

  StorageStatus:
    rpc: get-system-storage
    item: filesystem
    metrics:
      - name: storage_used_percent
        path: used-percent
        type: gauge
        help: Capacity of show system storage
    labels:
      - name: name
        path: filesystem-name
      - name: mounted_on
        path: mounted-on

  PhysicalInterfaceStatus:
    rpc: get-interface-information
    args:
      extensive: True
      interface_name: '[afgxe][et]-*'
    item: physical-interface
    metrics:
      - name: interface_admin_status
        path: admin-status
        type: gauge
        help: "Admin status of show interfaces extensive(Up: 2, Down: 1)"
        value_transform:
          up: 2
          down: 1
      - name: interface_oper_status
        path: oper-status
        type: gauge
        help: "Oper status of show interfaces extensive(Up: 2, Down: 1)"
        value_transform:
          up: 2
          down: 1
      - name: interface_speed
        path: speed
        type: gauge
        help: Speed of show interfaces extensive
        value_transform:
          100mbps: 100000000
          1000mbps: 1000000000
          "1000 Mbps": 1000000000
          1Gbps: 1000000000
          10Gbps: 10000000000
          100Gbps: 100000000000
      - name: interface_lastflap_seconds
        path: interface-flapped
        type: counter
        help: Last flapped of show interfaces extensive
        to_unixtime: True
      - name: interface_input_errors
        path: input-error-list.input-errors
        type: counter
        help: Input Errors of show interfaces extensive
      - name: interface_input_drops
        path: input-error-list.input-drops
        type: counter
        help: Input Drops of show interfaces extensive
      - name: interface_framing_errors
        path: input-error-list.framing-errors
        type: counter
        help: Input Framing errors of show interfaces extensive
      - name: interface_input_runts
        path: input-error-list.input-runts
        type: counter
        help: Input Runts of show interfaces extensive
      - name: interface_input_discards
        path: input-error-list.input-discards
        type: counter
        help: Input Policed discards of show interfaces extensive
      - name: interface_input_l3_incompletes
        path: input-error-list.input-l3-incompletes
        type: counter
        help: Input L3 incompletes of show interfaces extensive
      - name: interface_input_l2_channel_errors
        path: input-error-list.input-l2-channel-errors
        type: counter
        help: Input L2 channel errors of show interfaces extensive
      - name: interface_input_l2_mismatch_timeouts
        path: input-error-list.input-l2-mismatch-timeouts
        type: counter
        help: Input L2 mismatch timeouts of show interfaces extensive
      - name: interface_input_fifo_errors
        path: input-error-list.input-fifo-errors
        type: counter
        help: Input FIFO errors of show interfaces extensive
      - name: interface_input_resource_errors
        path: input-error-list.input-resource-errors
        type: counter
        help: Input Resource errors of show interfaces extensive
      - name: interface_carrier_transitions
        path: output-error-list.carrier-transitions
        type: counter
        help: Output Carrier transitions of show interfaces extensive
      - name: interface_output_errors
        path: output-error-list.output-errors
        type: counter
        help: Output Errors of show interfaces extensive
      - name: interface_output_drops
        path: output-error-list.output-drops
        type: counter
        help: Output Drops of show interfaces extensive
      - name: interface_collisions
        path: output-error-list.output-collisions
        type: counter
        help: Output Collisions of show interfaces extensive
      - name: interface_aged_packets
        path: output-error-list.aged-packets
        type: counter
        help: Output Aged packets of show interfaces extensive
      - name: interface_mtu_errors
        path: output-error-list.mtu-errors
        type: counter
        help: Output MTU errors of show interfaces extensive
      - name: interface_hs_link_crc_errors
        path: output-error-list.hs-link-crc-errors
        type: counter
        help: Output HS link CRC errors of show interfaces extensive
      - name: interface_output_fifo_errors
        path: output-error-list.output-fifo-errors
        type: counter
        help: Output FIFO errors of show interfaces extensive
      - name: interface_output_resource_errors
        path: output-error-list.output-resource-errors
        type: counter
        help: Output Resource errors of show interfaces extensive
      - name: interface_bit_error_seconds
        path: ethernet-pcs-statistics.bit-error-seconds
        type: counter
        help: PCS statistics Bit errors of show interfaces extensive
      - name: interface_errored_blocks_seconds
        path: ethernet-pcs-statistics.errored-blocks-seconds
        type: counter
        help: PCS statistics Errored blocks of show interfaces extensive
      - name: interface_input_bytes
        path: traffic-statistics.input-bytes
        type: counter
        help: Traffic statistics Input Bytes of show interfaces extensive
      - name: interface_output_bytes
        path: traffic-statistics.output-bytes
        type: counter
        help: Traffic statistics Output Bytes of show interfaces extensive
      - name: interface_input_packets
        path: traffic-statistics.input-packets
        type: counter
        help: Traffic statistics Input packets of show interfaces extensive
      - name: interface_output_packets
        path: traffic-statistics.output-packets
        type: counter
        help: Traffic statistics Output packets of show interfaces extensive
    labels:
      - name: interface
        path: name
      - name: description
        path: description

  LogicalInterfaceStatus:
    rpc: get-interface-information
    args:
      detail: True
      interface_name: '[afgxe][et]-*'
    container: physical-interface
    item: logical-interface
    metrics:
      - name: interface_admin_status
        path: if-config-flags.iff-down
        exists: True
        type: gauge
        help: "Admin status of show interfaces extensive(Up: 2, Down: 1)"
        value_transform:
          "false": 2
          "true": 1
      - name: interface_oper_status
        path: if-config-flags.iff-up
        exists: True
        type: gauge
        help: "Oper status of show interfaces extensive(Up: 2, Down: 1)"
        value_transform:
          "true": 2
          "false": 1
      - name: interface_input_bytes
        path: traffic-statistics.input-bytes
        type: counter
        help: Traffic statistics Input Bytes of show interfaces extensive
      - name: interface_output_bytes
        path: traffic-statistics.output-bytes
        type: counter
        help: Traffic statistics Output Bytes of show interfaces extensive
      - name: interface_input_packets
        path: traffic-statistics.input-packets
        type: counter
        help: Traffic statistics Input packets of show interfaces extensive
      - name: interface_output_packets
        path: traffic-statistics.output-packets
        type: counter
        help: Traffic statistics Output packets of show interfaces extensive
    labels:
      - name: interface
        path: name
        regex: ([^\.]*).*
      - name: unit
        path: name
        regex: .*\.(\d+)
      - name: description
        path: description

  InterfaceOpticStatus:
    rpc: get-interface-optics-diagnostics-information
    args:
      interface_name: '[efgx][et]-*'
    item: physical-interface
    metrics:
      - name: interface_rx_optic_power
        path: optics-diagnostics.rx-signal-avg-optical-power-dbm
        type: gauge
        help: Laser rx power of show interfaces diagnostics optics
      - name: interface_tx_optic_power
        path: optics-diagnostics.laser-output-power-dbm
        type: gauge
        help: Laser output power of show interfaces diagnostics optics
    labels:
      - name: interface
        path: name

  LldpStatus:
    rpc: get-lldp-neighbors-information
    item: lldp-neighbor-information
    metrics:
      - name: lldp_neighbor_info
        value: 1
        type: gauge
        help: Information of show lldp neighbor
    labels:
      - name: remote
        path: lldp-remote-system-name
      - name: interface
        path: lldp-local-port-id
      - name: remote_interface
        path: lldp-remote-port-id

  LacpStatus:
    rpc: get-lacp-interface-information
    container: lacp-interface-information
    item: lag-lacp-protocol
    metrics:
      - name: lacp_receive_state
        path: lacp-receive-state
        type: gauge
        help: "Receive State of show lacp interface(Current: 5, Defaulted: 4, Expired: 3, Initialize: 2, LACP disabled: 1, Port disabled: 0)"
        value_transform:
          "Current": 5
          "Defaulted": 4
          "Expired": 3
          "Initialize": 2
          "LACP disabled": 1
          "Port disabled": 0
      - name: lacp_transmit_state
        path: lacp-transmit-state
        type: gauge
        help: "Transmit State of show lacp interface(Fast periodic: 3, Slow periodic: 2, Periodic timer: 1, No periodic: 0)"
        value_transform:
          "Fast periodic": 3
          "Slow periodic": 2
          "Periodic timer": 1
          "No periodic": 0
      - name: lacp_mux_state
        path: lacp-mux-state
        type: gauge
        help: "Mux State of show lacp interface(Collecting distributing: 3, Attached: 2, Detached: 1, Waiting: 0)"
        value_transform:
          "Collecting distributing": 3
          "Attached": 2
          "Detached": 1
          "Waiting": 0
    labels:
      - name: interface
        path: name

  RouteStatus:
    rpc: get-route-summary-information
    container: route-table
    item: protocols
    metrics:
      - name: route_protocol_route_count
        path: protocol-route-count
        type: gauge
        help: Protocol routes of show route summary
      - name: route_active_route_count
        path: active-route-count
        type: gauge
        help: Protocol active routes of show route summary
    labels:
      - name: table
        path: table-name
      - name: protocol
        path: protocol-name

  ArpStatus:
    rpc: get-arp-table-information
    args:
      expiration-time: True
    item: arp-table-entry
    metrics:
      - name: arp_time_to_expire
        path: time-to-expire
        type: gauge
        help: TTE of show arp expiration-time
    labels:
      - name: address
        path: ip-address
      - name: mac
        path: mac-address
      - name: interface
        path: interface-name
        regex: ([^\.]*).*
      - name: unit
        path: interface-name
        regex: .*\.(\d+)

  OspfInterfaceStatus:
    rpc: get-ospf-interface-information
    args:
      detail: True
    item: ospf-interface
    metrics:
      - name: ospf_interface_cost
        path: interface-cost
        type: gauge
        help: Cost of show ospf interface detail
    labels:
      - name: interface
        path: interface-name
        regex: ([^\.]*).*
      - name: unit
        path: interface-name
        regex: .*\.(\d+)
      - name: area
        path: ospf-area

  OspfNeighborStatus:
    rpc: get-ospf-neighbor-information
    args:
      extensive: True
    item: ospf-neighbor
    metrics:
      - name: ospf_neighbor_state
        path: ospf-neighbor-state
        type: gauge
        help: "State of show ospf neighbor extensive(Full: 7, Loading: 6, 2Way: 5, Exchange: 4, ExStart: 3, Attempt: 2, Init: 1, Down: 0)"
        value_transform:
          "Full": 7
          "Loading": 6
          "2Way": 5
          "Exchange": 4
          "ExStart": 3
          "Attempt": 2
          "Init": 1
          "Down": 0
      - name: ospf_neighbor_uptime
        path: neighbor-up-time
        type: counter
        help: Up of show ospf neighbor extensive
        to_unixtime: True
    labels:
      - name: interface
        path: interface-name
        regex: ([^\.]*).*
      - name: unit
        path: interface-name
        regex: .*\.(\d+)
      - name: address
        path: neighbor-address
      - name: area
        path: ospf-area

  BgpStatus:
    rpc: get-bgp-summary-information
    item: bgp-peer
    metrics:
      - name: bgp_neighbor_state
        path: peer-state
        type: gauge
        help: "State of show bgp summary(Established: 5, OpenConfirm: 4, OpenSent: 3, Active: 2, Connect: 1, Idle: 0)"
        value_transform:
          "Established": 5
          "OpenConfirm": 4
          "OpenSent": 3
          "Active": 2
          "Connect": 1
          "Idle": 0
      - name: bgp_neighbor_flap_count
        path: flap-count
        type: counter
        help: Number of flaps of show bgp summary
      - name: bgp_neighbor_elapsed_time
        path: elapsed-time
        type: counter
        help: Elapsed time of show bgp summary
        to_unixtime: True
    labels:
      - name: peer_as
        path: peer-as
      - name: peer_address
        path: peer-address
      - name: peer_type
        path: peer-type
      - name: description
        path: description

  BgpRouteStatus:
    rpc: get-bgp-summary-information
    container: bgp-peer
    item: bgp-rib
    metrics:
      - name: bgp_neighbor_active_prefix_count
        path: active-prefix-count
        type: gauge
        help: Active of show bgp summary
      - name: bgp_neighbor_received_prefix_count
        path: received-prefix-count
        type: gauge
        help: Received of show bgp summary
      - name: bgp_neighbor_accepted_prefix_count
        path: accepted-prefix-count
        type: gauge
        help: Accepted of show bgp summary
      - name: bgp_neighbor_suppressed_prefix_count
        path: suppressed-prefix-count
        type: gauge
        help: Damped of show bgp summary
    labels:
      - name: peer_as
        path: peer-as
      - name: peer_address
        path: peer-address
      - name: peer_type
        path: peer-type
      - name: description
        path: description
      - name: table
        path: name

  VrrpStatus:
    rpc: get-vrrp-information
    args:
      detail: True
    container: vrrp-interface
    item: vrrp-vlan
    metrics:
      - name: vrrp_state
        path: vrrp-state
        type: gauge
        help: "VR State of show vrrp detail(master: 5, backup: 4, transition: 3, bringup: 2, init: 1, idle: 0)"
        value_transform:
          "master": 5
          "backup": 4
          "transition": 3
          "bringup": 2
          "init": 1
          "idle": 0
      - name: virtual_router_uptime
        path: virtual-router-uptime
        type: gauge
        help: "Virtual router uptime of show vrrp detail"
        to_unixtime: True
      - name: master_router_uptime
        path: master-router-uptime
        type: gauge
        help: "Master router uptime of show vrrp detail"
        to_unixtime: True
    labels:
      - name: interface
        path: physical-interface
      - name: unit
        path: unit
      - name: mode
        path:
          - vrrp-mode
          - active-inherit.vrrp-mode
      - name: group
        path: group

  BfdStatus:
    rpc: get-bfd-session-information
    item: bfd-session
    metrics:
      - name: bfd_state
        path: session-state
        type: gauge
        help: "State of show bfd session(Up: 3, Down: 2, Init: 1, Failing: 0)"
        value_transform:
          "Up": 3
          "Down": 2
          "Init": 1
          "Failing": 0
    labels:
      - name: interface
        path: session-interface
        regex: ([^\.]*).*
      - name: unit
        path: session-interface
        regex: .*\.(\d+)
      - name: neighbor
        path: session-neighbor
