general:
  prefix: junos
  timeout: 60

credentials:
  default:
    username: admin
    password: admin@123
#    private_key: ~/.ssh/id_rsa
#    private_key_passphrase: admin@123

modules:
  default:
    probes:
      - system_alarm_status
      - chassis_alarm_status
      - fpc_status
      - hardware_status
      - environment_status
      - control_board_status
      - routing_engine_status
      - storage_status
      - physical_interface_status
      - logical_interface_status
      - interface_optics_status
      - lldp_status
      - lacp_status
      - route_summary_status
      - arp_status
      - ospf_interface_status
      - ospf_neighbor_status
      - bgp_status
      - bgp_route_status
      - vrrp_status
      - bfd_status
      - ldp_neighbor_status
      - rsvp_interface_status
      - rsvp_neighbor_status
      - mpls_lsp_status
      - mpls_lsp_path_status

probes:
  system_alarm_status:
    rpc: get-system-alarm-information
    item: alarm-detail
    metrics:
      - name: system_alarm_timestamp_seconds
        path: alarm-time.@seconds
        type: gauge
        help: "Alarm time in seconds of show system alarm"
    labels:
      - name: class
        path: alarm-class
      - name: description
        path: alarm-description
      - name: type
        path: alarm-type

  chassis_alarm_status:
    rpc: get-alarm-information
    item: alarm-detail
    metrics:
      - name: chassis_alarm_timestamp_seconds
        path: alarm-time.@seconds
        type: gauge
        help: "Alarm time in seconds of show chassis alarm"
    labels:
      - name: class
        path: alarm-class
      - name: description
        path: alarm-description
      - name: type
        path: alarm-type

  fpc_status:
    rpc: get-fpc-information
    item: fpc
    recursive: True
    metrics:
      - name: fpc_state
        path: state
        type: gauge
        help: "State of show chassis fpc(Online: 3, Offline: 2, Present: 1, Empty: 0)"
        value_transform:
          "Online": 3
          "Offline": 2
          "Present": 1
          "Empty": 0
      - name: fpc_cpu_total_percent
        path: cpu-total
        type: gauge
        help: "CPU Utilization Total of show chassis fpc"
      - name: fpc_memory_heap_percent
        path: memory-heap-utilization
        help: "Memory Utilization Heap of show chassis fpc"
        type: gauge
      - name: fpc_memory_buffer_percent
        path: memory-buffer-utilization
        help: "Memory Utilization Buffer of show chassis fpc"
        type: gauge
    labels:
      - name: slot
        path: slot

  hardware_status:
    rpc: get-chassis-inventory
    item:
      - chassis
      - chassis-module
      - chassis-sub-module
      - chassis-sub-sub-module
      - chassis-sub-sub-sub-module
    recursive: True
    metrics:
      - name: hardware_info
        value: 1
        type: gauge
        help: "Information of show chassis hardware"
    labels:
      - name: name
        path: name
      - name: serial_number
        path: serial-number
      - name: part_number
        path: part-number
      - name: description
        path: description

  environment_status:
    rpc: get-environment-information
    item: environment-item
    metrics:
      - name: environment_state
        path: status
        type: gauge
        help: "Status of show chassis environment(OK: 4, Testing: 3, Check: 2, Failed: 1, Absent: 0)"
        value_transform:
          "OK": 4
          "Testing": 3
          "Check": 2
          "Failed": 1
          "Absent": 0
      - name: temperature_celsius
        path: temperature.@celsius
    labels:
      - name: name
        path: name

  control_board_status:
    rpc: get-environment-cb-information
    item: environment-component-item
    metrics:
      - name: control_board_state
        path: state
        type: gauge
        help: "Current state of show chassis environment cb(Online: 1, Offline: 0)"
        value_transform:
          "Online Master": 1
          "Online Standby": 1
          "Online": 1
          "Offline": 0
    labels:
      - name: slot
        path: name
        regex: CB.*(\d+)

  routing_engine_status:
    rpc: get-route-engine-information
    item: route-engine
    metrics:
      - name: routing_engine_mastership_state
        path: mastership-state
        type: gauge
        help: "Current state of show chassis routing-engine(Master: 2, Backup: 1, Disabled: 0)"
        value_transform:
          "master": 2
          "backup": 1
          "disabled": 0
      - name: routing_engine_memory_buffer_percent
        path: memory-buffer-utilization
        type: gauge
        help: "Memory utilization of show chassis routing-engine"
      - name: routing_engine_cpu_user_percent
        path: cpu-user
        type: gauge
        help: "CPU utilization User of show chassis routing-engine"
      - name: routing_engine_cpu_background_percent
        path: cpu-background
        type: gauge
        help: "CPU utilization Background of show chassis routing-engine"
      - name: routing_engine_cpu_system_percent
        path: cpu-system
        type: gauge
        help: "CPU utilization Kernel of show chassis routing-engine"
      - name: routing_engine_cpu_interrupt_percent
        path: cpu-interrupt
        type: gauge
        help: "CPU utilization Interrupt of show chassis routing-engine"
      - name: routing_engine_cpu_idle_percent
        path: cpu-idle
        type: gauge
        help: "CPU utilization Idle of show chassis routing-engine"
      - name: routing_engine_start_time_seconds
        path: start-time.@seconds
        type: gauge
        help: "Start time in seconds of show chassis routing-engine"
    labels:
      - name: slot
        path: slot

  storage_status:
    rpc: get-system-storage
    item: filesystem
    metrics:
      - name: storage_used_percent
        path: used-percent
        type: gauge
        help: "Capacity of show system storage"
    labels:
      - name: filesystem
        path: filesystem-name
      - name: mounted_on
        path: mounted-on

  physical_interface_status:
    rpc: get-interface-information
    args:
      extensive: True
      interface_name: '[afgxe][et]-*'
    item: physical-interface
    metrics:
      - name: interface_admin_status
        path: admin-status
        type: gauge
        help: "Admin status of show interfaces extensive(Up: 2, Down: 1)"
        value_transform:
          up: 2
          down: 1
      - name: interface_oper_status
        path: oper-status
        type: gauge
        help: "Oper status of show interfaces extensive(Up: 2, Down: 1)"
        value_transform:
          up: 2
          down: 1
      - name: interface_speed_bits_per_second
        path: speed
        type: gauge
        help: "Speed of show interfaces extensive"
        value_transform:
          100mbps: 100000000
          1000mbps: 1000000000
          "1000 Mbps": 1000000000
          1Gbps: 1000000000
          10Gbps: 10000000000
          100Gbps: 100000000000
      - name: interface_last_flapped_timestamp_seconds
        path: interface-flapped.@seconds
        type: gauge
        help: "Last flapped in seconds of show interfaces extensive"
      - name: interface_input_errors
        path: input-error-list.input-errors
        type: counter
        help: "Input Errors of show interfaces extensive"
      - name: interface_input_drops
        path: input-error-list.input-drops
        type: counter
        help: "Input Drops of show interfaces extensive"
      - name: interface_framing_errors
        path: input-error-list.framing-errors
        type: counter
        help: "Input Framing errors of show interfaces extensive"
      - name: interface_input_runts
        path: input-error-list.input-runts
        type: counter
        help: "Input Runts of show interfaces extensive"
      - name: interface_input_policed_discards
        path: input-error-list.input-discards
        type: counter
        help: "Input Policed discards of show interfaces extensive"
      - name: interface_input_l3_incompletes
        path: input-error-list.input-l3-incompletes
        type: counter
        help: "Input L3 incompletes of show interfaces extensive"
      - name: interface_input_l2_channel_errors
        path: input-error-list.input-l2-channel-errors
        type: counter
        help: "Input L2 channel errors of show interfaces extensive"
      - name: interface_input_l2_mismatch_timeouts
        path: input-error-list.input-l2-mismatch-timeouts
        type: counter
        help: "Input L2 mismatch timeouts of show interfaces extensive"
      - name: interface_input_fifo_errors
        path: input-error-list.input-fifo-errors
        type: counter
        help: "Input FIFO errors of show interfaces extensive"
      - name: interface_input_resource_errors
        path: input-error-list.input-resource-errors
        type: counter
        help: "Input Resource errors of show interfaces extensive"
      - name: interface_carrier_transitions
        path: output-error-list.carrier-transitions
        type: counter
        help: "Output Carrier transitions of show interfaces extensive"
      - name: interface_output_errors
        path: output-error-list.output-errors
        type: counter
        help: "Output Errors of show interfaces extensive"
      - name: interface_output_drops
        path: output-error-list.output-drops
        type: counter
        help: "Output Drops of show interfaces extensive"
      - name: interface_collisions
        path: output-error-list.output-collisions
        type: counter
        help: "Output Collisions of show interfaces extensive"
      - name: interface_aged_packets
        path: output-error-list.aged-packets
        type: counter
        help: "Output Aged packets of show interfaces extensive"
      - name: interface_mtu_errors
        path: output-error-list.mtu-errors
        type: counter
        help: "Output MTU errors of show interfaces extensive"
      - name: interface_hs_link_crc_errors
        path: output-error-list.hs-link-crc-errors
        type: counter
        help: "Output HS link CRC errors of show interfaces extensive"
      - name: interface_output_fifo_errors
        path: output-error-list.output-fifo-errors
        type: counter
        help: "Output FIFO errors of show interfaces extensive"
      - name: interface_output_resource_errors
        path: output-error-list.output-resource-errors
        type: counter
        help: "Output Resource errors of show interfaces extensive"
      - name: interface_bit_error_seconds
        path: ethernet-pcs-statistics.bit-error-seconds
        type: counter
        help: "PCS statistics Bit errors of show interfaces extensive"
      - name: interface_errored_blocks_seconds
        path: ethernet-pcs-statistics.errored-blocks-seconds
        type: counter
        help: "PCS statistics Errored blocks of show interfaces extensive"
      - name: interface_input_bytes
        path: traffic-statistics.input-bytes
        type: counter
        help: "Traffic statistics Input Bytes of show interfaces extensive"
      - name: interface_output_bytes
        path: traffic-statistics.output-bytes
        type: counter
        help: "Traffic statistics Output Bytes of show interfaces extensive"
      - name: interface_input_packets
        path: traffic-statistics.input-packets
        type: counter
        help: "Traffic statistics Input packets of show interfaces extensive"
      - name: interface_output_packets
        path: traffic-statistics.output-packets
        type: counter
        help: "Traffic statistics Output packets of show interfaces extensive"
    labels:
      - name: interface
        path: name
      - name: description
        path: description

  logical_interface_status:
    rpc: get-interface-information
    args:
      detail: True
      interface_name: '[afgxe][et]-*'
    container: physical-interface
    item: logical-interface
    metrics:
      - name: interface_admin_status
        path: if-config-flags.iff-down
        exists: True
        type: gauge
        help: "Admin status of show interfaces extensive(Up: 2, Down: 1)"
        value_transform:
          "false": 2
          "true": 1
      - name: interface_oper_status
        path: if-config-flags.iff-up
        exists: True
        type: gauge
        help: "Oper status of show interfaces extensive(Up: 2, Down: 1)"
        value_transform:
          "true": 2
          "false": 1
      - name: interface_input_bytes
        path: traffic-statistics.input-bytes
        type: counter
        help: "Traffic statistics Input Bytes of show interfaces extensive"
      - name: interface_output_bytes
        path: traffic-statistics.output-bytes
        type: counter
        help: "Traffic statistics Output Bytes of show interfaces extensive"
      - name: interface_input_packets
        path: traffic-statistics.input-packets
        type: counter
        help: "Traffic statistics Input packets of show interfaces extensive"
      - name: interface_output_packets
        path: traffic-statistics.output-packets
        type: counter
        help: "Traffic statistics Output packets of show interfaces extensive"
    labels:
      - name: interface
        path: name
        regex: ([^\.]*).*
      - name: unit
        path: name
        regex: .*\.(\d+)
      - name: description
        path: description

  interface_optics_status:
    rpc: get-interface-optics-diagnostics-information
    container: physical-interface
    args:
      interface_name: '[efgx][et]-*'
    item:
      - optics-diagnostics
      - optics-diagnostics-lane-values
    recursive: True
    metrics:
      - name: interface_optics_rx_power_dbm
        path: rx-signal-avg-optical-power-dbm
        type: gauge
        help: "Laser rx power of show interfaces diagnostics optics"
      - name: interface_optics_tx_power_dbm
        path: laser-output-power-dbm
        type: gauge
        help: "Laser output power of show interfaces diagnostics optics"
    labels:
      - name: interface
        path: name
      - name: lane
        path: lane-index

  lldp_status:
    rpc: get-lldp-neighbors-information
    item: lldp-neighbor-information
    metrics:
      - name: lldp_neighbor_info
        value: 1
        type: gauge
        help: "Information of show lldp neighbor"
    labels:
      - name: remote
        path: lldp-remote-system-name
      - name: interface
        path: lldp-local-port-id
      - name: remote_interface
        path: lldp-remote-port-id

  lacp_status:
    rpc: get-lacp-interface-information
    container: lacp-interface-information
    item: lag-lacp-protocol
    metrics:
      - name: lacp_receive_state
        path: lacp-receive-state
        type: gauge
        help: "Receive State of show lacp interface(Current: 5, Defaulted: 4, Expired: 3, Initialize: 2, LACP disabled: 1, Port disabled: 0)"
        value_transform:
          "Current": 5
          "Defaulted": 4
          "Expired": 3
          "Initialize": 2
          "LACP disabled": 1
          "Port disabled": 0
      - name: lacp_transmit_state
        path: lacp-transmit-state
        type: gauge
        help: "Transmit State of show lacp interface(Fast periodic: 3, Slow periodic: 2, Periodic timer: 1, No periodic: 0)"
        value_transform:
          "Fast periodic": 3
          "Slow periodic": 2
          "Periodic timer": 1
          "No periodic": 0
      - name: lacp_mux_state
        path: lacp-mux-state
        type: gauge
        help: "Mux State of show lacp interface(Collecting distributing: 3, Attached: 2, Detached: 1, Waiting: 0)"
        value_transform:
          "Collecting distributing": 3
          "Attached": 2
          "Detached": 1
          "Waiting": 0
    labels:
      - name: interface
        path: name

  route_summary_status:
    rpc: get-route-summary-information
    container: route-table
    item: protocols
    metrics:
      - name: route_protocol_routes
        path: protocol-route-count
        type: gauge
        help: "Protocol routes of show route summary"
      - name: route_active_routes
        path: active-route-count
        type: gauge
        help: "Protocol active routes of show route summary"
    labels:
      - name: table
        path: table-name
      - name: protocol
        path: protocol-name

  arp_status:
    rpc: get-arp-table-information
    args:
      expiration-time: True
      no-resolve: True
    item: arp-table-entry
    metrics:
      - name: arp_time_to_expire_seconds
        path: time-to-expire
        type: gauge
        help: "TTE of show arp expiration-time"
    labels:
      - name: address
        path: ip-address
      - name: mac
        path: mac-address
      - name: interface
        path: interface-name
        regex: ([^\.]*).*
      - name: unit
        path: interface-name
        regex: .*\.(\d+)

  ospf_interface_status:
    rpc: get-ospf-interface-information
    args:
      detail: True
    item: ospf-interface
    metrics:
      - name: ospf_interface_cost
        path: interface-cost
        type: gauge
        help: "Cost of show ospf interface detail"
    labels:
      - name: interface
        path: interface-name
        regex: ([^\.]*).*
      - name: unit
        path: interface-name
        regex: .*\.(\d+)
      - name: area
        path: ospf-area

  ospf_neighbor_status:
    rpc: get-ospf-neighbor-information
    args:
      extensive: True
    item: ospf-neighbor
    metrics:
      - name: ospf_neighbor_state
        path: ospf-neighbor-state
        type: gauge
        help: "State of show ospf neighbor extensive(Full: 7, Loading: 6, 2Way: 5, Exchange: 4, ExStart: 3, Attempt: 2, Init: 1, Down: 0)"
        value_transform:
          "Full": 7
          "Loading": 6
          "2Way": 5
          "Exchange": 4
          "ExStart": 3
          "Attempt": 2
          "Init": 1
          "Down": 0
      - name: ospf_neighbor_uptime_seconds
        path: neighbor-up-time.@seconds
        type: gauge
        help: "Uptime in seconds of show ospf neighbor extensive"
    labels:
      - name: interface
        path: interface-name
        regex: ([^\.]*).*
      - name: unit
        path: interface-name
        regex: .*\.(\d+)
      - name: address
        path: neighbor-address
      - name: area
        path: ospf-area

  bgp_status:
    rpc: get-bgp-summary-information
    item: bgp-peer
    metrics:
      - name: bgp_neighbor_state
        path: peer-state
        type: gauge
        help: "State of show bgp summary(Established: 5, OpenConfirm: 4, OpenSent: 3, Active: 2, Connect: 1, Idle: 0)"
        value_transform:
          "Established": 5
          "OpenConfirm": 4
          "OpenSent": 3
          "Active": 2
          "Connect": 1
          "Idle": 0
      - name: bgp_neighbor_flaps
        path: flap-count
        type: counter
        help: "Number of flaps of show bgp summary"
      - name: bgp_neighbor_elapsed_time_seconds
        path: elapsed-time.@seconds
        type: gauge
        help: "Elapsed time in seconds of show bgp summary"
    labels:
      - name: peer_as
        path: peer-as
      - name: address
        path: peer-address
      - name: description
        path: description

  bgp_route_status:
    rpc: get-bgp-summary-information
    container: bgp-peer
    item: bgp-rib
    metrics:
      - name: bgp_neighbor_active_prefixes
        path: active-prefix-count
        type: gauge
        help: "Active prefixes of show bgp summary"
      - name: bgp_neighbor_received_prefixes
        path: received-prefix-count
        type: gauge
        help: "Received prefixes of show bgp summary"
      - name: bgp_neighbor_accepted_prefixes
        path: accepted-prefix-count
        type: gauge
        help: "Accepted prefixes of show bgp summary"
      - name: bgp_neighbor_suppressed_prefixes
        path: suppressed-prefix-count
        type: gauge
        help: "Suppressed prefixes of show bgp summary"
    labels:
      - name: peer_as
        path: peer-as
      - name: address
        path: peer-address
      - name: description
        path: description
      - name: table
        path: name

  vrrp_status:
    rpc: get-vrrp-information
    args:
      extensive: True
    container: vrrp-interface
    item: vrrp-vlan
    metrics:
      - name: vrrp_state
        path: vrrp-state
        type: gauge
        help: "VR State of show vrrp extensive(master: 5, backup: 4, transition: 3, bringup: 2, init: 1, idle: 0)"
        value_transform:
          "master": 5
          "backup": 4
          "transition": 3
          "bringup": 2
          "init": 1
          "idle": 0
      - name: vrrp_priority
        path: group-priority
        type: gauge
        help: "Priority of show vrrp extensive"
      - name: vrrp_idle_master_transitions
        path: group-vrrp-state-transition-statistics.idle-master-transitions
        type: counter
        help: "State transition(idle to master) of show vrrp extensive"
      - name: vrrp_idle_backup_transitions
        path: group-vrrp-state-transition-statistics.idle-backup-transitions
        type: counter
        help: "State transition(idle to backup) of show vrrp extensive"
      - name: vrrp_backup_master_transitions
        path: group-vrrp-state-transition-statistics.backup-master-transitions
        type: counter
        help: "State transition(backup to master) of show vrrp extensive"
      - name: vrrp_master_backup_transitions
        path: group-vrrp-state-transition-statistics.master-backup-transitions
        type: counter
        help: "State transition(master to backup) of show vrrp extensive"
    labels:
      - name: interface
        path: physical-interface
      - name: unit
        path: unit
      - name: mode
        path:
          - vrrp-mode
          - active-inherit.vrrp-mode
      - name: group
        path: group

  bfd_status:
    rpc: get-bfd-session-information
    item: bfd-session
    metrics:
      - name: bfd_state
        path: session-state
        type: gauge
        help: "State of show bfd session(Up: 3, Down: 2, Init: 1, Failing: 0)"
        value_transform:
          "Up": 3
          "Down": 2
          "Init": 1
          "Failing": 0
    labels:
      - name: interface
        path: session-interface
        regex: ([^\.]*).*
      - name: unit
        path: session-interface
        regex: .*\.(\d+)
      - name: address
        path: session-neighbor

  ldp_neighbor_status:
    rpc: get-ldp-neighbor-information
    args:
      detail: True
    item: ldp-neighbor
    metrics:
      - name: ldp_neighbor_uptime_seconds
        path: ldp-up-time.@seconds
        type: gauge
        help: "Up time in seconds of show ldp neighbor detail"
    labels:
      - name: interface
        path: interface-name
        regex: ([^\.]*).*
      - name: unit
        path: interface-name
        regex: .*\.(\d+)
      - name: address
        path: ldp-neighbor-address
      - name: transport_address
        path: ldp-transport-address

  rsvp_interface_status:
    rpc: get-rsvp-interface-information
    item: rsvp-interface
    metrics:
      - name: rsvp_interface_state
        path: rsvp-status
        type: gauge
        help: "State of show rsvp interface(Up: 1, Down: 0)"
        value_transform:
          "Up": 1
          "Down": 0
      - name: rsvp_interface_active_reservations
        path: rsvp-telink.active-reservation
        type: gauge
        help: "Active reservations of show rsvp interface"
      - name: rsvp_interface_static_bandwidth_bits_per_second
        path: rsvp-telink.static-bandwidth-bps
        type: gauge
        help: "Static bandwidth in bps of show rsvp interface"
      - name: rsvp_interface_available_bandwidth_bits_per_second
        path: rsvp-telink.available-bandwidth-bps
        type: gauge
        help: "Available bandwidth in bps of show rsvp interface"
      - name: rsvp_interface_reserved_bandwidth_bits_per_second
        path: rsvp-telink.total-reserved-bandwidth-bps
        type: gauge
        help: "Reserved bandwidth in bps of show rsvp interface"
    labels:
      - name: interface
        path: interface-name
        regex: ([^\.]*).*
      - name: unit
        path: interface-name
        regex: .*\.(\d+)

  rsvp_neighbor_status:
    rpc: get-rsvp-neighbor-information
    args:
      detail: True
    item: rsvp-neighbor
    metrics:
      - name: rsvp_neighbor_state
        path: rsvp-neighbor-status
        type: gauge
        help: "State of show rsvp neighbor detail(Up: 1, Dead: 0)"
        value_transform:
          "Up": 1
          "Dead": 0
      - name: rsvp_neighbor_last_changed_seconds
        path: last-changed-time.@seconds
        type: gauge
        help: "Seconds since the last state change of show rsvp neighbor detail"
    labels:
      - name: address
        path: rsvp-neighbor-address
      - name: interface
        path: rsvp-neighbor-interface
        regex: ([^\.]+).*
      - name: unit
        path: rsvp-neighbor-interface
        regex: .*\.(\d+)

  mpls_lsp_status:
    rpc: get-mpls-lsp-information
    args:
      ingress: True
      detail: True
    container: rsvp-session-data.rsvp-session
    item: mpls-lsp
    metrics:
      - name: mpls_lsp_state
        path: lsp-state
        type: gauge
        help: "State of show mpls lsp ingress detail(Up: 1, Dn: 0)"
        value_transform:
          "Up": 1
          "Dn": 0
    labels:
      - name: name
        path: name
      - name: source_address
        path: source-address
      - name: destination_address
        path: destination-address

  mpls_lsp_path_status:
